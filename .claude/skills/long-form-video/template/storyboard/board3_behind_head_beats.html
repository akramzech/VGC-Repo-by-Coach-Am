<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="thumbs.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:Poppins,sans-serif;color:#fff}
.abs{position:absolute}
.sm{font-weight:500;color:#fff;font-size:50px;line-height:1.1;text-shadow:0 0 .1em rgba(255,255,255,.7),0 0 .35em rgba(255,255,255,.3),0 .05em .07em rgba(0,0,0,.85),0 .1em .22em rgba(0,0,0,.7),0 .2em .55em rgba(0,0,0,.5)}
.bg2{font-weight:800;text-transform:uppercase;line-height:1.04;letter-spacing:-.012em;white-space:nowrap;font-size:120px}
.y{color:#FFFF00;font-weight:800;text-shadow:0 0 .05em rgba(255,255,0,.95),0 0 .2em rgba(255,255,0,.6),0 0 .45em rgba(255,255,0,.35),0 .05em .07em rgba(0,0,0,.85),0 .1em .22em rgba(0,0,0,.7),0 .2em .55em rgba(0,0,0,.5)}
.w{color:#fff;font-weight:600;text-shadow:0 0 .06em rgba(255,255,255,.9),0 0 .2em rgba(255,255,255,.5),0 0 .45em rgba(255,255,255,.28),0 .05em .07em rgba(0,0,0,.85),0 .1em .22em rgba(0,0,0,.7),0 .2em .55em rgba(0,0,0,.5)}
.r{color:#FF4D4D;font-weight:800;text-shadow:0 0 .05em rgba(255,77,77,.95),0 0 .2em rgba(255,77,77,.6),0 .05em .07em rgba(0,0,0,.85)}
.num{font-weight:800;color:#fff;letter-spacing:-.02em;text-shadow:0 0 .08em rgba(255,255,255,.9),0 0 .3em rgba(255,255,255,.45),0 .06em .1em rgba(0,0,0,.6)}
.lab{font-weight:800;color:#FFFF00;text-transform:uppercase;text-shadow:0 0 .2em rgba(255,255,0,.6)}
.glass{position:absolute;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.07));border:2px solid rgba(255,255,255,.35);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.chip{position:absolute;border-radius:22px;background:rgba(15,18,36,.72);border:2px solid rgba(255,255,255,.4);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.pill{display:inline-block;background:#FFFF00;color:#0F1224;font-weight:800;border-radius:999px;padding:2px 26px 4px}
.bgimg{position:absolute;left:0;top:0;width:1920px;height:1080px}
.cutimg{position:absolute;left:0;top:0;width:1920px;height:1080px;filter:drop-shadow(0 0 3px rgba(255,255,255,.9)) drop-shadow(0 0 22px rgba(255,255,255,.55))}
.nocut{filter:none}
.tile{position:absolute;width:112px;height:199px;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.55);box-shadow:0 12px 30px rgba(0,0,0,.55)}
.tile img{width:100%;height:100%;object-fit:cover}
svg{overflow:visible}
</style></head><body><div id="f"></div>
<script>
const q=new URLSearchParams(location.search).get('s')||'price';
const f=document.getElementById('f'); const Y='#FFFF00',RED='#FF4D4D',NAVY='#0F1224';
const BG={price:0,race:1,videos:2,bench:3,adapt:4,outro:5};
const base=(k,bw)=>`<img class="bgimg" src="src/bg${BG[k]}.png" style="${bw?'filter:grayscale(1) brightness(.55) contrast(1.1)':''}">`;
const cut=(k,glow)=>`<img class="cutimg" src="src/cut${BG[k]}.png" style="${glow?'':'filter:none'}">`;
const dim=`<div class="abs" style="left:0;top:0;width:1920px;height:1080px;background:linear-gradient(180deg,rgba(0,0,0,.0) 50%,rgba(0,0,0,.4) 100%)"></div>`;
const coin=(x,y,r,t)=>`<div class="abs" style="left:${x}px;top:${y}px;width:${r}px;height:${r}px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7a0,${Y} 55%,#c9b800);box-shadow:0 0 40px ${Y}88;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:${r*.45}px;color:${NAVY}">${t}</div>`;
const S={};
S.price=()=>{let s=base('price',false)+`<div class="abs" style="left:0;top:0;width:1920px;height:1080px;background:linear-gradient(90deg,rgba(43,15,92,.55),rgba(43,15,92,0) 30%,rgba(43,15,92,0) 70%,rgba(43,15,92,.55))"></div>`;
  s+=`<div class="glass" style="left:120px;top:150px;width:520px;height:300px;transform:rotate(-8deg) perspective(900px) rotateY(12deg)"></div><div class="lab abs" style="left:120px;width:520px;top:175px;text-align:center;font-size:40px;transform:rotate(-8deg)">CLAUDE</div><div class="num abs" style="left:120px;width:520px;top:230px;text-align:center;font-size:150px;line-height:1;transform:rotate(-8deg)">20</div><div class="lab abs" style="left:120px;width:520px;top:390px;text-align:center;font-size:30px;color:#fff;transform:rotate(-8deg)">USD / SEBULAN</div>`;
  s+=`<div class="glass" style="left:1280px;top:170px;width:520px;height:300px;transform:rotate(7deg) perspective(900px) rotateY(-12deg)"></div><div class="lab abs" style="left:1280px;width:520px;top:195px;text-align:center;font-size:40px;transform:rotate(7deg)">CHATGPT</div><div class="num abs" style="left:1280px;width:520px;top:250px;text-align:center;font-size:150px;line-height:1;transform:rotate(7deg)">20</div><div class="lab abs" style="left:1280px;width:520px;top:410px;text-align:center;font-size:30px;color:#fff;transform:rotate(7deg)">USD / SEBULAN</div>`;
  s+=coin(760,60,110,'$')+coin(1070,110,90,'$')+coin(560,480,80,'$')+coin(1330,520,100,'$')+coin(300,640,70,'$');
  s+=cut('price',false)+dim;
  s+=`<div class="abs" style="left:0;width:1920px;top:800px;text-align:center"><div class="sm" style="font-size:44px">convert lebih kurang</div><div class="bg2 y" style="font-size:150px">RM90–100 / BULAN</div></div>`; return s};
S.race=()=>{let s=base('race',false)+`<div class="abs" style="left:0;top:0;width:1920px;height:1080px;background:linear-gradient(90deg,rgba(60,0,0,.5),rgba(0,0,0,0) 35%,rgba(0,0,0,0) 65%,rgba(40,40,0,.45))"></div>`;
  for(let i=0;i<5;i++) s+=`<div class="abs" style="left:${90+i*50}px;top:${120+i*34}px;width:280px;height:330px;border-radius:22px;background:#f4f1ea;border:3px solid #cfc9bb;box-shadow:0 18px 40px rgba(0,0,0,.45);transform:rotate(${-12+i*5}deg)"><div style="height:76px;background:${RED};border-radius:19px 19px 0 0"></div><div style="font-size:110px;font-weight:800;color:#222;text-align:center;line-height:1.4">${[1,2,3,4,'→'][i]}</div></div>`;
  s+=`<div class="num abs" style="left:60px;width:560px;top:500px;text-align:center;font-size:96px;color:${RED};text-shadow:0 0 30px ${RED}88">3–4 HARI</div>`;
  s+=`<svg class="abs" style="left:1360px;top:110px" width="400" height="400" viewBox="0 0 400 400"><circle cx="200" cy="215" r="150" fill="rgba(15,18,36,.75)" stroke="rgba(255,255,255,.3)" stroke-width="20"/><circle cx="200" cy="215" r="150" fill="none" stroke="${Y}" stroke-width="20" stroke-linecap="round" stroke-dasharray="942" stroke-dashoffset="640" transform="rotate(-90 200 215)" style="filter:drop-shadow(0 0 16px ${Y})"/><path d="M200 215 V120" stroke="#fff" stroke-width="12" stroke-linecap="round"/><rect x="170" y="22" width="60" height="30" rx="8" fill="#fff"/></svg>`;
  s+=`<div class="num abs" style="left:1300px;width:520px;top:520px;text-align:center;font-size:90px;color:${Y};text-shadow:0 0 30px ${Y}88">15–20 MINIT</div>`;
  s+=`<svg class="abs" style="left:690px;top:80px" width="540" height="140" viewBox="0 0 540 140"><path d="M10 70 C140 -10 400 -10 530 70" fill="none" stroke="${Y}" stroke-width="8" stroke-dasharray="16 12" style="filter:drop-shadow(0 0 10px ${Y})"/><path d="M500 38 L536 72 L494 90" fill="none" stroke="${Y}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  s+=cut('race',false)+dim+`<div class="abs" style="left:0;width:1920px;top:830px;text-align:center"><div class="sm" style="font-size:44px">dulu minta team · sekarang dengan Claude</div></div>`; return s};
S.videos=()=>{let s=base('videos',true)+`<div class="abs" style="left:0;top:0;width:1920px;height:1080px;background:rgba(10,8,30,.35)"></div>`;
  const rows=[ [60,-30,0],[250,-80,40],[440,-10,80],[630,-60,20] ];
  const T=TH; let n=0;
  s+=`<div class="abs" style="left:-200px;top:-30px;width:2400px;height:1100px;transform:perspective(2200px) rotateX(10deg) rotateZ(-7deg);transform-origin:50% 50%">`;
  rows.forEach((r,ri)=>{for(let c=0;c<20;c++){const src=T[(n*7+ri*3)%T.length]; n++; s+=`<div class="tile" style="left:${r[1]+c*128+(ri%2)*60}px;top:${r[0]+60}px"><img src="${src}"></div>`}});
  s+=`</div>`;
  s+=cut('videos',true)+`<div class="abs" style="left:0;top:0;width:1920px;height:1080px;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)"></div>`;
  s+=`<div class="abs" style="left:0;width:1920px;top:690px;text-align:center"><div class="sm" style="font-size:44px">sebulan dengan Claude, lebih</div></div><div class="num abs" style="left:0;width:1920px;top:735px;text-align:center;font-size:250px;line-height:1">100+</div><div class="bg2 y abs" style="left:0;width:1920px;top:960px;text-align:center;font-size:84px;line-height:1">VIDEO</div>`; return s};
S.bench=()=>{let s=base('bench',false)+`<div class="abs" style="left:0;top:0;width:1920px;height:1080px;background:rgba(15,18,36,.35)"></div>`;
  s+=`<div class="abs" style="left:60px;top:640px;width:520px;height:440px;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.08));border-top:5px solid #fff;border-radius:16px 16px 0 0"></div><div class="abs" style="left:1330px;top:230px;width:530px;height:850px;background:linear-gradient(180deg,rgba(255,255,0,.4),rgba(255,255,0,.1));border-top:6px solid ${Y};border-radius:16px 16px 0 0;box-shadow:0 -20px 60px rgba(255,255,0,.3)"></div>`;
  ['PREMIERE','AFTER EFFECTS','CAPCUT'].forEach((t,i)=>s+=`<div class="chip" style="left:${80+i*160}px;top:${560+(i%2)*28}px;width:150px;height:80px;font-size:15px">${t}</div>`);
  s+=`<div class="lab abs" style="left:80px;top:700px;font-size:30px;color:#fff">BENCHMARK LAMA</div><div class="lab abs" style="left:1350px;top:270px;font-size:34px">BENCHMARK BARU</div>`;
  s+=`<div class="chip" style="left:1350px;top:120px;width:490px;height:100px;font-size:44px;border-color:${Y};color:${Y};box-shadow:0 0 50px ${Y}66">EDITOR + AI</div>`;
  s+=`<svg class="abs" style="left:560px;top:230px" width="700" height="420" viewBox="0 0 700 420"><path d="M20 400 C220 380 420 260 620 60 M540 40 L632 52 L612 140" fill="none" stroke="${Y}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 14px ${Y})"/></svg>`;
  s+=cut('bench',false)+dim+`<div class="abs" style="left:0;width:1920px;top:40px;text-align:center"><div class="sm" style="font-size:44px">kompetensi dia</div><div class="bg2 y" style="font-size:110px">LAGI TINGGI</div></div>`; return s};
S.adapt=()=>{let s=base('adapt',false)+`<div class="abs" style="left:0;top:0;width:1920px;height:1080px;background:rgba(43,15,92,.4)"></div>`;
  const I=[['AUTOMATE','kerja berulang','<svg width="120" height="120" viewBox="0 0 64 64" fill="none" stroke="'+Y+'" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M52 30 A20 20 0 0 0 16 22 M12 34 A20 20 0 0 0 48 42"/><path d="M16 10 V22 H28 M48 54 V42 H36"/></svg>',100,170,-8],['FOKUS','story','<svg width="120" height="120" viewBox="0 0 64 64" fill="none" stroke="'+Y+'" stroke-width="5" stroke-linejoin="round"><path d="M32 14 C24 8 14 8 6 10 V50 C14 48 24 48 32 54 C40 48 50 48 58 50 V10 C50 8 40 8 32 14 Z M32 14 V54"/></svg>',1420,150,7],['FOKUS','conversion','<svg width="120" height="120" viewBox="0 0 64 64" fill="none" stroke="'+Y+'" stroke-width="5" stroke-linejoin="round"><path d="M6 10 H58 L38 34 V54 L26 48 V34 Z"/></svg>',560,60,5]];
  I.forEach(t=>s+=`<div class="glass" style="left:${t[3]}px;top:${t[4]}px;width:400px;height:320px;transform:rotate(${t[5]}deg)"><div style="text-align:center;margin-top:26px">${t[2]}</div><div class="lab" style="text-align:center;font-size:44px;margin-top:6px">${t[0]}</div><div class="num" style="text-align:center;font-size:30px;font-weight:600">${t[1]}</div></div>`);
  s+=`<svg class="abs" style="left:0;top:0" width="1920" height="1080"><g stroke="${Y}" stroke-width="4" fill="none" stroke-dasharray="12 10" style="filter:drop-shadow(0 0 8px ${Y})"><path d="M500 380 C700 470 860 450 960 420"/><path d="M1420 360 C1250 450 1100 450 1000 420"/><path d="M760 380 V300"/></g></svg>`;
  s+=cut('adapt',false)+dim+`<div class="abs" style="left:0;width:1920px;top:800px;text-align:center"><div class="sm" style="font-size:44px">kita kena jadi orang yang</div><div class="bg2 y" style="font-size:150px">ADAPT</div></div>`; return s};
S.outro=()=>{let s=base('outro',false)+`<div class="abs" style="left:0;top:0;width:1920px;height:1080px;background:rgba(43,15,92,.35)"></div>`;
  for(let i=0;i<5;i++){const first=i==0; const x=[110,360,1330,1580,860][i], y=[140,330,160,360,40][i], rot=[-9,6,8,-6,0][i]; s+=`<div class="abs" style="left:${x}px;top:${y}px;width:200px;height:260px;border-radius:22px;background:${first?'rgba(255,255,0,.2)':'rgba(255,255,255,.1)'};border:${first?'4px solid '+Y:'3px dashed rgba(255,255,255,.45)'};transform:rotate(${rot}deg);${first?`box-shadow:0 0 50px ${Y}66`:''}"><div class="num" style="text-align:center;font-size:92px;margin-top:40px;color:${first?'#fff':'rgba(255,255,255,.6)'}">${i==4?7:i+1}</div><div class="lab" style="text-align:center;font-size:24px;color:${first?Y:'rgba(255,255,255,.55)'}">${first?'HARI INI':(i==1?'ESOK':'·')}</div></div>`}
  s+=cut('outro',false)+dim+`<div class="abs" style="left:0;width:1920px;top:790px;text-align:center"><div class="sm" style="font-size:44px">episod pertama</div><div class="bg2" style="font-size:130px"><span class="y">1 HARI</span> <span class="w">·</span> <span class="y">1 VLOG</span></div></div>`; return s};
f.innerHTML=`<div style="position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden">${S[q]()}</div>`;
</script></body></html>
