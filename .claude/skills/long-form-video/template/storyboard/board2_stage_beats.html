<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:Poppins,sans-serif;color:#fff}
.abs{position:absolute}
.sc{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0}
.cell{position:absolute;width:958px;height:538px;overflow:hidden;background:#000}
.sm{font-weight:500;color:#fff;font-size:50px;line-height:1.1;text-shadow:0 0 .1em rgba(255,255,255,.7),0 0 .35em rgba(255,255,255,.3),0 .05em .07em rgba(0,0,0,.85),0 .1em .22em rgba(0,0,0,.7),0 .2em .55em rgba(0,0,0,.5)}
.bg2{font-weight:800;text-transform:uppercase;line-height:1.04;letter-spacing:-.012em;white-space:nowrap;font-size:120px}
.y{color:#FFFF00;font-weight:800;text-shadow:0 0 .05em rgba(255,255,0,.95),0 0 .2em rgba(255,255,0,.6),0 0 .45em rgba(255,255,0,.35),0 .05em .07em rgba(0,0,0,.85),0 .1em .22em rgba(0,0,0,.7),0 .2em .55em rgba(0,0,0,.5)}
.w{color:#fff;font-weight:600;text-shadow:0 0 .06em rgba(255,255,255,.9),0 0 .2em rgba(255,255,255,.5),0 0 .45em rgba(255,255,255,.28),0 .05em .07em rgba(0,0,0,.85),0 .1em .22em rgba(0,0,0,.7),0 .2em .55em rgba(0,0,0,.5)}
.r{color:#FF4D4D;font-weight:800;text-shadow:0 0 .05em rgba(255,77,77,.95),0 0 .2em rgba(255,77,77,.6),0 0 .45em rgba(255,77,77,.35),0 .05em .07em rgba(0,0,0,.85),0 .1em .22em rgba(0,0,0,.7)}
.num{font-weight:800;color:#fff;letter-spacing:-.02em;text-shadow:0 0 .08em rgba(255,255,255,.9),0 0 .3em rgba(255,255,255,.45),0 .06em .1em rgba(0,0,0,.6)}
.lab{font-weight:800;color:#FFFF00;text-transform:uppercase;text-shadow:0 0 .2em rgba(255,255,0,.6)}
.glass{position:absolute;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:2px solid rgba(255,255,255,.28);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 40px rgba(255,255,255,.05)}
.chip{position:absolute;border-radius:22px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.pill{display:inline-block;background:#FFFF00;color:#0F1224;font-weight:800;border-radius:999px;padding:2px 26px 4px}
.stP{position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(1300px 800px at 50% 45%,#4B1D96 0%,#2B0F5C 45%,#140a33 100%)}
.stN{position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(1300px 760px at 50% 50%,#1b2350,#0F1224 70%)}
.notes{position:absolute;left:0;top:0;width:958px;height:538px;background:#0b0e1c;padding:34px 40px;font-size:24px;line-height:1.42;color:#cfd3ff}
.notes b{color:#FFFF00;font-weight:800}.notes h3{font-size:30px;color:#fff;margin-bottom:10px}
.bt{position:absolute}
.btb{position:absolute;left:0;top:0;border-style:solid;border-color:#fff;background:rgba(255,255,255,.07)}
.btn{position:absolute;width:34px;border-radius:0 14px 14px 0;background:#fff}
.btc{position:absolute}
.btt{position:absolute;left:0;top:0;text-align:center;font-weight:800;letter-spacing:-.02em}
svg{overflow:visible}
</style></head><body><div id="f"></div>
<script>
const Q=new URLSearchParams(location.search), q=Q.get('s')||'1';
const f=document.getElementById('f');
const Y='#FFFF00',RED='#FF4D4D',GRN='#35E08A',NAVY='#0F1224';
const bat=(x,y,w,h,lv,col=Y,num=true,glow=1)=>{const segs=5,gap=14,pad=20,iw=(w-pad*2-gap*(segs-1))/segs;
  let s=`<div class="bt" style="left:${x}px;top:${y}px;width:${w+40}px;height:${h}px"><div class="btb" style="width:${w}px;height:${h}px;border-radius:${h*.16}px;border-width:${h*.035}px;box-shadow:0 0 ${glow*70}px ${col}66,inset 0 0 50px rgba(255,255,255,.06)"></div><div class="btn" style="left:${w+6}px;top:${h*.32}px;height:${h*.36}px"></div>`;
  for(let i=0;i<segs;i++){const on=Math.max(0,Math.min(1,lv*segs-i)); if(on<=0)continue; s+=`<div class="btc" style="left:${pad+i*(iw+gap)}px;top:${pad}px;width:${iw*on}px;height:${h-pad*2}px;border-radius:${h*.08}px;background:linear-gradient(180deg,${col},${col}cc);box-shadow:0 0 36px ${col}aa"></div>`}
  if(num) s+=`<div class="btt" style="width:${w}px;height:${h}px;line-height:${h}px;font-size:${h*.5}px;color:${lv>=.5?NAVY:'#fff'}">${Math.round(lv*100)}%</div>`;
  return s+'</div>'};
const ic={
 cut:(c='#fff')=>`<svg width="90" height="90" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"><circle cx="16" cy="48" r="9"/><circle cx="16" cy="16" r="9"/><path d="M23 22 L56 50 M23 42 L56 14"/></svg>`,
 spark:(c='#fff')=>`<svg width="90" height="90" viewBox="0 0 64 64" fill="${c}"><path d="M32 4 L39 25 L60 32 L39 39 L32 60 L25 39 L4 32 L25 25 Z"/></svg>`,
 text:(c='#fff')=>`<svg width="90" height="90" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round"><path d="M10 14 H54 M32 14 V54"/></svg>`,
 film:(c='#fff')=>`<svg width="90" height="90" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="4"><rect x="8" y="10" width="48" height="44" rx="5"/><path d="M8 22 H56 M8 42 H56 M20 10 V54 M44 10 V54"/></svg>`,
 rocket:(c='#fff')=>`<svg width="90" height="90" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="4" stroke-linejoin="round"><path d="M32 6 C46 14 48 32 42 46 H22 C16 32 18 14 32 6 Z"/><circle cx="32" cy="26" r="5"/><path d="M24 46 L20 58 M40 46 L44 58 M32 48 V60" stroke="#FFB84D"/></svg>`,
 card:(c='#fff')=>`<svg width="150" height="110" viewBox="0 0 100 70" fill="none" stroke="${c}" stroke-width="4"><rect x="4" y="8" width="92" height="54" rx="9"/><path d="M4 24 H96"/><rect x="12" y="42" width="26" height="8" rx="2"/></svg>`,
 clock:(c='#fff')=>`<svg width="90" height="90" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"><circle cx="32" cy="32" r="24"/><path d="M32 18 V32 L42 38"/></svg>`,
 cal:(c='#fff')=>`<svg width="90" height="90" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"><rect x="8" y="12" width="48" height="44" rx="6"/><path d="M8 26 H56 M20 6 V16 M44 6 V16"/></svg>`,
 bolt:(c=NAVY)=>`<svg width="70" height="98" viewBox="0 0 60 84"><path d="M36 0 L6 48 H28 L22 84 L54 32 H32 Z" fill="${c}"/></svg>`,
 funnel:(c='#fff')=>`<svg width="90" height="90" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="5" stroke-linejoin="round"><path d="M6 10 H58 L38 34 V54 L26 48 V34 Z"/></svg>`,
 book:(c='#fff')=>`<svg width="90" height="90" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="5" stroke-linejoin="round"><path d="M32 14 C24 8 14 8 6 10 V50 C14 48 24 48 32 54 C40 48 50 48 58 50 V10 C50 8 40 8 32 14 Z M32 14 V54"/></svg>`,
 loop:(c='#fff')=>`<svg width="90" height="90" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M52 30 A20 20 0 0 0 16 22 M12 34 A20 20 0 0 0 48 42"/><path d="M16 10 V22 H28 M48 54 V42 H36"/></svg>`,
 up:(c='#fff')=>`<svg width="90" height="90" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M32 56 V10 M14 28 L32 8 L50 28"/></svg>`,
 coin:(c=Y)=>`<svg width="90" height="90" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="${c}"/><circle cx="32" cy="32" r="22" fill="none" stroke="${NAVY}" stroke-width="3"/><text x="32" y="43" text-anchor="middle" font-size="30" font-weight="800" fill="${NAVY}" font-family="Poppins">$</text></svg>`,
};
const plain=(t)=>`<div class="abs" style="left:0;top:0;width:1920px;height:1080px">${t}</div>`;
const SC={};
// ---------------------------------------------------------------- 1 HOOK (cold open, climax clip)
SC.hook=(st)=>{const imgs=['h197.0','h201.0','h203.5'][st];
  let s=`<img class="abs" src="src/${imgs}.png" style="left:0;top:0;width:1920px;height:1080px;transform:scale(${[1.12,1.2,1.3][st]});transform-origin:960px 420px">`;
  s+=`<div class="abs" style="left:0;top:0;width:1920px;height:1080px;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.35) 100%)"></div>`;
  if(st==0){
    s+=`<div class="abs" style="left:110px;top:690px"><div class="sm">ada yang sampai</div><div class="bg2 r" style="font-size:150px">3–4 HARI</div></div>`;
    for(let i=0;i<5;i++) s+=`<div class="abs" style="left:${1440+i*28}px;top:${70+i*20}px;width:300px;height:340px;border-radius:22px;background:#f4f1ea;border:3px solid #cfc9bb;box-shadow:0 18px 40px rgba(0,0,0,.45);transform:rotate(${i*3-6}deg)"><div style="height:80px;background:${RED};border-radius:19px 19px 0 0"></div><div style="font-size:120px;font-weight:800;color:#222;text-align:center;line-height:1.35">${[1,2,3,4,'4'][i]}</div></div>`;
  }
  if(st==1){
    s+=`<div class="abs" style="left:110px;top:640px"><div class="sm">dengan Claude, dia tak ada alasan</div><div class="bg2 y" style="font-size:150px">TAK ADA <span class="w">MC</span></div></div>`;
    s+=`<div class="abs" style="left:1360px;top:70px;width:420px;height:300px;border-radius:18px;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:rotate(-7deg)"><div style="margin:26px 30px;font-weight:800;font-size:30px;color:#333">SIJIL CUTI SAKIT</div><div style="margin:0 30px;height:14px;background:#ddd;border-radius:7px"></div><div style="margin:14px 30px;height:14px;width:60%;background:#ddd;border-radius:7px"></div><div style="margin:14px 30px;height:14px;width:75%;background:#ddd;border-radius:7px"></div></div>`;
    s+=`<div class="abs" style="left:1340px;top:150px;width:460px;height:0;border-top:14px solid ${RED};transform:rotate(-24deg);box-shadow:0 0 30px ${RED}"></div><div class="abs" style="left:1340px;top:80px;width:460px;height:0;border-top:14px solid ${RED};transform:rotate(24deg);box-shadow:0 0 30px ${RED}"></div>`;
  }
  if(st==2){
    s+=`<div class="abs" style="left:0;top:0;width:1920px;height:1080px;background:radial-gradient(900px 600px at 50% 62%,rgba(255,255,0,.18),rgba(0,0,0,0))"></div>`;
    s+=`<div class="abs" style="left:0;width:1920px;top:640px;text-align:center"><div class="sm">satu video siap dalam</div><div class="bg2 y" style="font-size:210px">15–20 MINIT</div></div>`;
    s+=`<svg class="abs" style="left:1450px;top:80px" width="300" height="300" viewBox="0 0 300 300"><circle cx="150" cy="150" r="120" fill="rgba(15,18,36,.65)" stroke="rgba(255,255,255,.3)" stroke-width="18"/><circle cx="150" cy="150" r="120" fill="none" stroke="${Y}" stroke-width="18" stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="500" transform="rotate(-90 150 150)" style="filter:drop-shadow(0 0 14px ${Y})"/><path d="M150 150 V70" stroke="#fff" stroke-width="10" stroke-linecap="round"/><rect x="130" y="14" width="40" height="22" rx="6" fill="#fff"/></svg>`;
  }
  return s};
// ---------------------------------------------------------------- 2 COMPARE (real assets, full screen)
SC.compare=()=>{let s=`<div class="stP"></div>`;
  s+=`<div class="abs" style="left:0;width:1920px;top:50px;text-align:center"><div class="sm">cuba tengok dua perbezaan ni</div></div>`;
  s+=`<div class="abs" style="left:110px;top:200px;width:830px;height:467px;border-radius:26px;overflow:hidden;border:3px solid rgba(255,255,255,.35);box-shadow:0 40px 90px rgba(0,0,0,.6);transform:perspective(1800px) rotateY(9deg) rotate(-1.5deg)"><img src="src/gpt.jpg" style="width:100%;height:100%;object-fit:cover"></div>`;
  s+=`<div class="abs" style="left:980px;top:200px;width:830px;height:467px;border-radius:26px;overflow:hidden;border:3px solid ${Y};box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 60px rgba(255,255,0,.35);transform:perspective(1800px) rotateY(-9deg) rotate(1.5deg)"><img src="src/claude.jpg" style="width:100%;height:100%;object-fit:cover"></div>`;
  s+=`<div class="abs" style="left:110px;width:830px;top:710px;text-align:center"><span class="pill" style="font-size:44px">CONTOH CHATGPT</span></div><div class="abs" style="left:980px;width:830px;top:710px;text-align:center"><span class="pill" style="font-size:44px">CONTOH CLAUDE</span></div>`;
  s+=`<div class="abs" style="left:900px;top:380px;width:120px;height:120px;border-radius:50%;background:${NAVY};border:5px solid ${Y};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:46px;color:${Y};box-shadow:0 0 40px ${Y}88">VS</div>`;
  s+=`<div class="abs" style="left:0;width:1920px;top:850px;text-align:center"><div class="bg2" style="font-size:96px"><span class="w">LAGI </span><span class="y">SMOOTH</span></div></div>`;
  return s};
// ---------------------------------------------------------------- 3 USAGE
SC.usage=()=>{let s=`<div class="stP"></div>`;
  s+=`<div class="abs" style="left:0;width:1920px;top:40px;text-align:center"><div class="sm">software AI yang buat benda advance</div><div class="bg2" style="font-size:96px"><span class="y">KREDIT</span> <span class="w">·</span> <span class="y">TOKEN</span> <span class="w">·</span> <span class="y">USAGE</span></div></div>`;
  [['KREDIT',240,330],['TOKEN',1380,330]].forEach(([t,x,y])=>s+=`<div class="abs" style="left:${x}px;top:${y}px">${ic.coin()}</div><div class="chip" style="left:${x-60}px;top:${y+100}px;width:230px;height:70px;font-size:30px">${t}</div>`);
  s+=`<svg class="abs" style="left:620px;top:280px" width="680" height="400" viewBox="0 0 680 400"><path d="M40 360 A300 300 0 0 1 640 360" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="44" stroke-linecap="round"/><path d="M40 360 A300 300 0 0 1 640 360" fill="none" stroke="${Y}" stroke-width="44" stroke-linecap="round" stroke-dasharray="942" stroke-dashoffset="0" style="filter:drop-shadow(0 0 20px ${Y})"/><path d="M340 360 L560 200" stroke="#fff" stroke-width="12" stroke-linecap="round"/><circle cx="340" cy="360" r="26" fill="#fff"/></svg>`;
  s+=`<div class="abs lab" style="left:620px;width:680px;top:690px;text-align:center;font-size:54px;letter-spacing:6px">USAGE</div>`;
  s+=`<svg class="abs" style="left:0;top:0" width="1920" height="1080"><g stroke="${Y}" stroke-width="5" fill="none" stroke-dasharray="14 10" style="filter:drop-shadow(0 0 8px ${Y})"><path d="M360 420 C520 420 560 520 660 600"/><path d="M1500 420 C1340 420 1300 520 1260 600"/></g></svg>`;
  s+=`<div class="glass" style="left:200px;top:760px;width:640px;height:200px"></div><div class="glass" style="left:1080px;top:760px;width:640px;height:200px"></div>`;
  s+=`<div class="num abs" style="left:200px;width:640px;top:800px;text-align:center;font-size:70px">CLAUDE</div><div class="num abs" style="left:1080px;width:640px;top:800px;text-align:center;font-size:70px">CHATGPT</div>`;
  s+=`<div class="abs" style="left:850px;top:770px;width:220px;text-align:center;font-weight:800;font-size:150px;color:${Y};text-shadow:0 0 30px ${Y}">=</div>`;
  return s};
// ---------------------------------------------------------------- 4 BATTERY hero (3 states)
SC.battery=(st)=>{let s=`<div class="stP"></div>`;
  const lv=[0,.6,1][st];
  if(st==2){ for(let i=0;i<14;i++){const a=i*(360/14); s+=`<div class="abs" style="left:960px;top:560px;width:900px;height:6px;transform-origin:0 50%;transform:rotate(${a}deg);background:linear-gradient(90deg,rgba(255,255,0,.55),rgba(255,255,0,0))"></div>`} }
  s+=`<div class="abs" style="left:0;width:1920px;top:60px;text-align:center"><div class="sm">konsep dia lebih kurang macam</div><div class="bg2" style="font-size:180px;opacity:${[.0,.6,1][st]}"><span class="y">BATERI</span></div></div>`;
  s+=`<div class="abs" style="left:0;top:0;width:1920px;height:1080px;transform:perspective(2000px) rotateX(${[18,10,0][st]}deg) scale(${[.8,.92,1][st]});transform-origin:50% 60%">${bat(480,360,860,420,lv,Y,true,[.4,1,1.6][st])}</div>`;
  if(st==1) s+=`<div class="abs" style="left:1040px;top:230px;opacity:.95;filter:drop-shadow(0 0 20px ${Y})">${ic.bolt(Y)}</div>`;
  if(st==2){ s+=`<div class="abs lab" style="left:0;width:1920px;top:850px;text-align:center;font-size:48px;letter-spacing:8px">USAGE ANDA</div>`; [[300,300,26],[1560,330,20],[330,780,18],[1500,760,24],[200,520,14],[1700,560,16]].forEach(([x,y,r])=>s+=`<div class="abs" style="left:${x}px;top:${y}px;width:${r}px;height:${r}px;border-radius:50%;background:${Y};opacity:.7;box-shadow:0 0 30px ${Y}"></div>`) }
  return s};
// ---------------------------------------------------------------- 5 TASKS drain (3 states)
SC.tasks=(st)=>{let s=`<div class="stP"></div>`;
  s+=`<div class="abs" style="left:110px;top:44px"><div class="sm" style="font-size:46px">bateri pakai ikut</div><div class="bg2" style="font-size:112px"><span class="y">KOMPLEKSITI</span> <span class="w">TASK</span></div></div>`;
  const lv=[.88,.5,.1][st], col=st==2?RED:Y;
  s+=bat(100,430,700,340,lv,col,true,1.2);
  const rows=[[ic.cut,'POTONG VIDEO','SIKIT',GRN,.18],[ic.spark,'ANIMASI','BANYAK',RED,.55],[ic.text,'TEXT','BANYAK',RED,.5],[ic.film,'B-ROLL','BANYAK',RED,.75],[ic.rocket,'EFEK TERBANG','BANYAK',RED,1]];
  const show=[1,3,5][st];
  rows.slice(0,show).forEach((r,i)=>{const top=240+i*128;
    s+=`<div class="chip" style="left:1020px;top:${top}px;width:800px;height:108px;justify-content:space-between;padding:0 26px 0 14px"><div style="display:flex;align-items:center;gap:20px"><div style="transform:scale(.7);margin:-10px">${r[0](r[3])}</div><span style="font-size:36px">${r[1]}</span></div><span style="display:flex;align-items:center;gap:18px"><span style="display:block;width:${220*r[4]}px;height:20px;border-radius:10px;background:${r[3]};box-shadow:0 0 22px ${r[3]}"></span><span style="font-size:26px;font-weight:800;color:${r[3]};width:130px;text-align:right">${r[2]}</span></span></div>`;
    s+=`<svg class="abs" style="left:800px;top:${top+54}px" width="220" height="${Math.abs(600-top-54)+6}" viewBox="0 0 220 ${Math.abs(600-top-54)+6}"><path d="M220 ${top<546?3:Math.abs(600-top-54)+3} C120 ${top<546?3:Math.abs(600-top-54)+3}, 100 ${top<546?Math.abs(600-top-54)+3:3}, 0 ${top<546?Math.abs(600-top-54)+3:3}" stroke="${r[3]}" stroke-width="4" fill="none" stroke-dasharray="14 10" style="filter:drop-shadow(0 0 8px ${r[3]})"/></svg>`;
  });
  if(st==2){ s+=`<div class="abs" style="left:0;top:0;width:1920px;height:1080px;box-shadow:inset 0 0 160px rgba(255,77,77,.45)"></div><div class="abs r" style="left:100px;width:740px;top:800px;text-align:center;font-size:54px;font-weight:800">MAKAN BATERI BANYAK</div>` }
  return s};
// ---------------------------------------------------------------- 6 THREE SIZES
SC.sizes=()=>{let s=`<div class="stN"></div>`;
  s+=`<div class="abs" style="left:0;width:1920px;top:34px;text-align:center"><div class="sm" style="font-size:48px">satu content, terus export dalam</div><div class="bg2 y" style="font-size:104px">3 SIZE</div></div>`;
  s+=`<div class="abs" style="left:760px;top:240px;width:400px;height:225px;border-radius:20px;overflow:hidden;border:3px solid #fff;box-shadow:0 0 50px rgba(255,255,255,.3)"><img src="src/g169.jpg" style="width:100%;height:100%;object-fit:cover"></div><div class="abs lab" style="left:760px;width:400px;top:470px;text-align:center;font-size:30px;color:#fff">1 CONTENT</div>`;
  s+=`<svg class="abs" style="left:0;top:0" width="1920" height="1080"><g stroke="${Y}" stroke-width="5" fill="none" stroke-dasharray="14 10" style="filter:drop-shadow(0 0 8px ${Y})"><path d="M900 490 C760 540 520 520 401 550"/><path d="M960 490 V610"/><path d="M1020 490 C1160 540 1400 600 1530 690"/></g></svg>`;
